apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
    spec:
      tolerations:
      nodeSelector:
      containers:
        - name: server
          image: checkoutservice
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 5050
          readinessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:5050", "-tls", "-tls-ca-cert=/var/run/grpc-tls-ca/ca.crt", "-tls-server-name=checkoutservice"]
          livenessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:5050", "-tls", "-tls-ca-cert=/var/run/grpc-tls-ca/ca.crt", "-tls-server-name=checkoutservice"]
          volumeMounts:
          - name: grpc-server-tls
            mountPath: /var/run/grpc-server-tls
            readOnly: true
          - name: grpc-tls-ca
            mountPath: /var/run/grpc-tls-ca
            readOnly: true
          env:
          - name: PORT
            value: "5050"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcatalogservice:3550"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: PAYMENT_SERVICE_ADDR
            value: "paymentservice:50051"
          - name: EMAIL_SERVICE_ADDR
            value: "emailservice:5000"
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "cartservice:7070"
          - name: GRPC_TLS_CERT
            value: "/var/run/grpc-server-tls/tls.crt"
          - name: GRPC_TLS_KEY
            value: "/var/run/grpc-server-tls/tls.key"
          - name: GRPC_TLS_CA
            value: "/var/run/grpc-tls-ca/ca.crt"
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: SIGNALFX_ENDPOINT_URL
            # value: "http://zipkin.default:9411/api/v2/spans"
            value: "http://$(NODE_IP):9411/api/v2/spans"
          - name: MAX_RETRY_ATTEMPTS
            value: "20"
          - name: RETRY_INITIAL_SLEEP_MILLIS
            value: "25"
          resources:
            requests:
              cpu: 70m
              memory: 64Mi
            limits:
              cpu: 70m
              memory: 128Mi
      volumes:
      - name: grpc-server-tls
        secret:
          secretName: checkoutservice-grpc-tls
      - name: grpc-tls-ca
        configMap:
          name: grpc-tls-ca
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
spec:
  type: ClusterIP
  selector:
    app: checkoutservice
  ports:
  - name: grpc
    port: 5050
    targetPort: 5050

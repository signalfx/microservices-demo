plugins {
    id 'com.google.protobuf' version '0.10.0'
    id 'idea'
    id 'application'
}

repositories {
    mavenCentral()
    mavenLocal()
}

description = 'Ad Service'
group = "adservice"
version = "0.1.0-SNAPSHOT"

def grpcVersion = "1.82.1"
def protocVersion = "4.35.1"
def log4jVersion = "2.26.1"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation "io.grpc:grpc-protobuf:${grpcVersion}",
            "io.grpc:grpc-stub:${grpcVersion}",
            "io.grpc:grpc-netty-shaded:${grpcVersion}",
            "io.grpc:grpc-services:${grpcVersion}",
            "com.google.protobuf:protobuf-java:${protocVersion}",
            "com.google.protobuf:protobuf-java-util:${protocVersion}",
            "com.google.api.grpc:proto-google-common-protos:2.72.0",
            "org.apache.logging.log4j:log4j-api:${log4jVersion}",
            "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    compileOnly "javax.annotation:javax.annotation-api:1.3.2"

    runtimeOnly "com.fasterxml.jackson.core:jackson-core:2.22.0",
            "com.fasterxml.jackson.core:jackson-databind:2.22.0"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
        ofSourceSet('main')
    }
}

// Inform IDEs like IntelliJ IDEA, Eclipse or NetBeans about the generated code.
sourceSets {
    main {
        java {
            srcDirs 'hipstershop'
            srcDirs 'build/generated/source/proto/main/java/hipstershop'
            srcDirs 'build/generated/source/proto/main/grpc/hipstershop'
        }
    }
}

application {
    mainClass = 'hipstershop.AdService'
    applicationName = 'AdService'
}

dependencyLocking {
    lockAllConfigurations()
}
